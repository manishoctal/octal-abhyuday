# Render Blueprint — deploy as: New → Blueprint → pick this repo
services:
  - type: web
    name: octal-vote
    runtime: node
    plan: starter # 0.5 CPU / 512MB is enough for 100–200 users; bump to standard for headroom
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /login
    # Persistent disk: the SQLite file lives here so votes survive restarts & deploys
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: ALLOWED_EMAIL_DOMAIN
        value: octalsoftware.com
      - key: OTP_CODE
        value: '1234'
      - key: ADMIN_EMAILS
        value: manish.prajapati@octalsoftware.com
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret automatically
      # Push notifications (Web Push / VAPID). Generate with: npx web-push generate-vapid-keys
      # Leave the keys blank here and paste real values in the Render dashboard (kept out of git).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        value: manish.prajapati@octalsoftware.com
      # AWS S3 — photo storage (Phase 2+; gallery currently writes to the persistent disk).
      # Set these in the dashboard when migrating photo storage to S3.
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
